name: release

on:
  push:
    tags:
      - 'v*'

permissions: {}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 25
      - name: Check that the tag matches the project version
        run: |
          set -eu
          version=$(sed -n 's/^version=//p' gradle.properties)
          if [ -z "$version" ]; then
            echo "gradle.properties has no version line"; exit 1
          fi
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "The tag is $GITHUB_REF_NAME but gradle.properties says version=$version, so the jar would be named bluemap-worldscan-$version.jar."
            echo "Delete the tag, set version in gradle.properties, and tag the commit as v<version>."
            exit 1
          fi
      - name: Build
        run: ./gradlew build
      - name: Check the shadow jar
        run: bash .github/scripts/check-shadow-jar.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bluemap-worldscan-jar
          path: |
            build/libs/bluemap-worldscan-*.jar
            !build/libs/*-plain.jar
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: bluemap-worldscan-jar
          path: dist
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -eu
          jar=$(find dist -name 'bluemap-worldscan-*.jar')
          gh release create "$GITHUB_REF_NAME" "$jar" --verify-tag --generate-notes
